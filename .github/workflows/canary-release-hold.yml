# S4: release a held canary commit when the hold was the machine's fault, not the commit's (a
# runner fault that still looked like a failing action). `qqrelease canary release-hold` records a
# keyed operation and marks canary/<repo>/held/<commit>.json released on release-state, in one
# commit; the next canary run builds that commit again. No ref moves, so no executor App token.
# The dispatch names the hold: `released_before` is the number of entries in the hold record's
# `releases` (0 for a commit's first hold). A retried dispatch is a no-op; re-running a finished run
# after the commit was held again is refused, so each hold needs its own release.
# Close the hold's failure issue by hand with a note on what was wrong with the machine.
# Concurrency: its own group, so a release never cancels a pending canary or rollback (GitHub keeps
# one pending run per group). Its push to release-state rebases over theirs, and finish never writes
# a hold record that still holds, so the two cannot both change one record.
name: canary-release-hold
run-name: release the canary hold on ${{ inputs.repo }} ${{ inputs.commit }}
on:
  workflow_dispatch:
    inputs:
      repo:
        description: canary repo (infra-config repos.toml name)
        required: true
        type: string
      commit:
        description: full held commit (canary/<repo>/held/<commit>.json on release-state)
        required: true
        type: string
      released_before:
        description: entries in the hold record's `releases` (0 for the commit's first hold)
        required: true
        default: "0"
        type: string
      reason:
        description: why the hold was the machine's fault (recorded in the operation; one line, under 500 characters)
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: release-canary-holds
  cancel-in-progress: false
jobs:
  release-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write           # push this repo's release-state branch only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/executor
        with:
          writes: "true"
      - name: release the hold
        env:
          REPO: ${{ inputs.repo }}
          COMMIT: ${{ inputs.commit }}
          REASON: ${{ inputs.reason }}
          RELEASED_BEFORE: ${{ inputs.released_before }}
          REQUESTED_BY: ${{ github.actor }} (triggered by ${{ github.triggering_actor }})
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          qqrelease canary release-hold --config .qq/infra-config --state .qq/state --publish \
            --repo "$REPO" --commit "$COMMIT" --reason "$REASON" \
            --released-before "$RELEASED_BEFORE" --actor "$RUN_URL" --requested-by "$REQUESTED_BY" | tee -a "$GITHUB_STEP_SUMMARY"
