# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash               # -eo pipefail: a failing command before a pipe fails the step
jobs:
  presubmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: python
        with:
          python-version: "3.14"
      - name: read the infra-config pin
        id: pin
        run: python -c "import tomllib; print('commit=' + tomllib.load(open('pins.toml', 'rb'))['infra-config']['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/infra-config
          ref: ${{ steps.pin.outputs.commit }}
          path: .qq/infra-config
          persist-credentials: false
      - name: read the gate pin
        id: gatepin
        run: python -c "import tomllib; print('commit=' + tomllib.load(open('pins.toml', 'rb'))['gate']['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/gate
          ref: ${{ steps.gatepin.outputs.commit }}
          path: .qq/gate
          persist-credentials: false
      - name: core code names no language, build tool or deploy target (gate's agnosticism guard)
        run: |
          python -m venv .qq/gate-venv
          .qq/gate-venv/bin/pip install --quiet -e .qq/gate
          .qq/gate-venv/bin/qqgate guard --repo release --github .
      - name: the executor's pinned install works on this runner (hashes, commits, pip check)
        env:
          PYTHONSAFEPATH: "1"
        run: |
          python -m venv "$RUNNER_TEMP/executor-venv"
          PATH="$RUNNER_TEMP/executor-venv/bin:$PATH" bash .github/actions/executor/install.sh
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      # The unit tests isolate git from the machine's config. This runs the executor's push credential
      # and its check against this runner's real global and system git config, with a dummy token, so
      # a credential helper or URL rewrite in the runner image fails here rather than in a writer job.
      - name: the release-state push credential check passes on this runner image
        env:
          JOB_TOKEN: not-a-real-token
        run: |
          repo=$(mktemp -d "$RUNNER_TEMP/push-credential-XXXXXX")
          git -C "$repo" init -q -b main
          git -C "$repo" -c user.name=t -c user.email=t@t commit -q --allow-empty -m root
          git -C "$repo" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$repo" worktree add -q --orphan -b release-state .qq/state
          out=$(mktemp "$RUNNER_TEMP/push-credential-out-XXXXXX")
          (cd "$repo" && GITHUB_OUTPUT="$out" CLIENT_ID= bash "$GITHUB_WORKSPACE/.github/actions/executor/push-credential.sh")
          sha=$(sed -n 's/^header-sha256=//p' "$out")
          (cd "$repo/.qq/state" && EXPECTED_SHA256="$sha" APP_SLUG= bash "$GITHUB_WORKSPACE/.github/actions/executor/push-credential-check.sh")
      - name: lkgr moves on its own and never names a red commit (V0-REL-01 done-when, offline half)
        run: python tools/lkgr_demo.py --config .qq/infra-config
      - name: a rollback drill restores the previous canary in under 10 min (V0-REL-02 done-when)
        run: python tools/rollback_drill.py --config .qq/infra-config --budget-seconds 600
      - name: 7 daily canaries with no human touch, and a planted bad canary is held (V0-REL-03 done-when, offline half)
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: python tests/canary_demo.py --config .qq/infra-config --toolchain "python=$(dirname "$(dirname "$PYTHON_PATH")")"
