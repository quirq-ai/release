# V0-REL-02: roll a channel back to its previous commit and digest, by hand or by an agent.
# `qqrelease channel rollback` records the operation key on release-state, moves the target repo's
# `channels/<name>` ref back (compare-and-swap) and records the pointer and channels.json. Nothing is
# rebuilt, so this takes as long as the job takes to start. The drill in presubmit
# (tools/rollback_drill.py) proves the restore and its time budget offline on every change; the
# live half (job start plus the GitHub write) is this workflow's own 10-minute timeout.
# Queued runs: GitHub keeps one pending run per concurrency group (`release-channels`, shared with the
# canary's finish job), so a run that joins while one runs and one waits cancels the waiting one. Check that your run ran; pass `from` so a re-run or a
# double dispatch is refused instead of rolling back twice.
# The ref write needs the release executor identity; TODO(suraj): create it (see lkgr.yml).
name: channel-rollback
run-name: roll ${{ inputs.repo }} ${{ inputs.channel }} back
on:
  workflow_dispatch:
    inputs:
      repo:
        description: onboarded repo (infra-config repos.toml name)
        required: true
        type: string
      channel:
        description: channel to roll back
        required: true
        default: canary
        type: string
      reason:
        description: why (recorded in the operation)
        required: true
        type: string
      from:
        description: commit the channel names now (channels.json); refused if it moved, so a re-run is safe
        required: false
        default: ""
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: release-channels       # every writer of channel pointers; lkgr runs never cancel a rollback
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10         # the done-when budget: a rollback that takes longer has failed
    permissions:
      contents: write           # push this repo's release-state branch only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/executor
        with:
          writes: "true"
      - name: list the onboarded repos for the executor token
        id: repos
        run: |
          names=$(qqrelease repos --config .qq/infra-config)
          [ -n "$names" ] || { echo "::error::no onboarded repos: refusing an unscoped executor token"; exit 1; }
          echo "names=$names" >> "$GITHUB_OUTPUT"
      # The release executor identity. Absent until suraj creates it (see the header).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: executor
        if: vars.QQ_RELEASE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.QQ_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.QQ_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.names }}   # the onboarded repos only
          permission-contents: write
      - name: roll back
        env:
          QQ_RELEASE_TOKEN: ${{ steps.executor.outputs.token }}
          REPO: ${{ inputs.repo }}
          CHANNEL: ${{ inputs.channel }}
          REASON: ${{ inputs.reason }}
          FROM: ${{ inputs.from }}
        run: |
          qqrelease channel rollback --config .qq/infra-config --state .qq/state --publish \
            --repo "$REPO" --channel "$CHANNEL" --reason "$REASON" --from "$FROM" | tee -a "$GITHUB_STEP_SUMMARY"
