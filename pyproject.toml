[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qqrelease"
version = "0.1.0"
description = "quirq infra (qq) release: lkgr, channel pointers, rollback and the daily canary."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# The gardener's verdicts and config reader, pinned by commit (never copied).
dependencies = [
    "qqgarden @ git+https://github.com/quirq-ai/gardener@bad853c0464e0e56ae894ff3795cbb3e5e24ba48",
    # The canary's build, test and deploy stages run through the adapters (V0-REC-04, V0-REC-05).
    "qqrecipes @ git+https://github.com/quirq-ai/recipes@ab25f8c5b172c1357337e8afdf97d67338d43f46",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
qqrelease = "qqrelease.cli:main"

# `qq channel ...` in depot's qq.
[project.entry-points."qq.commands"]
channel = "qqrelease.cli:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
